name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Everything the driver claims, asserted on every commit: the naive
  # control falls into the stuck-bus and empty-bus traps, the real driver
  # steps around them, all 65 injected faults surface as the mapped
  # error, and no branch in bme280.c escapes coverage. No hardware, no
  # secrets - runs on a fork.
  host:
    name: host tests (controls + fault sweep + branch coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: controls, calibration traps, worked example, fault sweep, gate
        run: make -C test

      # The simulated sensor is this repo's own custom chip; this replays
      # the driver's I2C traffic against the chip's callbacks and requires
      # the two independent section-8.2 implementations to agree.
      - name: chip vs driver - the two datasheet readings must meet
        run: make -C chip host-test

      - name: keep the coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            test/build/gcov_summary.txt
            test/build/*.gcov
          if-no-files-found: error

  # Builds the real firmware - the same bme280.c the host job tested -
  # and runs it against Wokwi's simulated BME280, requiring compensated
  # readings that the firmware itself judged plausible (5 < T < 45 degC).
  firmware:
    name: build + simulate (ESP32 + BME280)
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: build with ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          command: idf.py build && idf.py uf2

      - name: report image size
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          command: idf.py size

      # Wokwi has no built-in BME280, so the simulation runs this repo's
      # own custom chip (chip/bme280.chip.c), compiled to wasm here.
      - name: build the custom BME280 chip (wasm)
        # --user root: the image's default user can't write the runner's
        # bind-mounted workspace (uid mismatch), so mkdir dist/ fails.
        run: >
          docker run --rm --user root -v ${{ github.workspace }}:/src -w /src
          wokwi/builder-clang-wasm make -C chip

      # Skipped automatically on forks and on clones without the secret set.
      # Get a free token at https://wokwi.com/dashboard/ci
      #
      # wokwi-cli is invoked directly (not via wokwi-ci-action, which is a
      # thin wrapper over the same binary) because only the CLI exposes
      # --vcd-file: the logic analyzer's capture of SDA/SCL is a build
      # artifact here, not just a pass/fail. The scenario's last step
      # waits for the t=10s heartbeat, so the 5 s task watchdog must stay
      # quiet for the run to pass.
      - name: simulate - require in-range readings, capture the wire
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          wget -q -O /usr/local/bin/wokwi-cli \
            https://github.com/wokwi/wokwi-cli/releases/latest/download/wokwi-cli-linuxstatic-x64
          chmod +x /usr/local/bin/wokwi-cli
          wokwi-cli --timeout 25000 --fail-text 'E (' \
            --scenario wokwi-ci.scenario.yaml \
            --serial-log-file wokwi-serial.log \
            --vcd-file i2c-trace.vcd .

      - name: keep the firmware image and any captured trace
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/uf2.bin
            build/bme280-driver-from-datasheet.elf
            build/bme280-driver-from-datasheet.map
            i2c-trace.vcd
            wokwi-serial.log
          if-no-files-found: warn
